name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest --cov=papertrail --cov-report=term-missing
      - name: Validate gold set
        run: papertrail-eval --gold data/gold/questions.jsonl
      # Milestone 2: run retrieval eval and gate against results/baseline.json
      # - run: papertrail-eval --results results/latest.json --baseline results/baseline.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t papertrail:ci .
      - name: Smoke test
        run: |
          docker run -d --name pt -p 8000:8000 papertrail:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs pt; exit 1
