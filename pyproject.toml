[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.1.0"
description = "Evaluated, citation-grounded question answering over ML-systems research papers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mahesh Reddy Pagadala" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
ingest = ["pymupdf>=1.24"]
# Installed in milestone 2 (retrieval), kept out of the base image until then.
retrieval = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2",
    "numpy>=1.26",
]

[project.scripts]
papertrail-eval = "papertrail.eval.run:main"
papertrail-ingest = "papertrail.ingest:main"
papertrail-index = "papertrail.index:main"
papertrail-eval-retrieval = "papertrail.eval.retrieval_eval:main"
papertrail-eval-answers = "papertrail.eval.answer_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/papertrail"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "rank_bm25", "sentence_transformers", "pgvector.*", "psycopg"]
ignore_missing_imports = true
